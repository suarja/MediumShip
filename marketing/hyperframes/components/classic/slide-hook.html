<!doctype html>
<html lang="fr" data-composition-variables='[
  {"id":"eyebrow","type":"string","label":"Eyebrow","default":"Articles. Podcasts. Vid&#233;os."},
  {"id":"hook","type":"string","label":"Hook","default":"Un seul m&#233;dia."},
  {"id":"subline","type":"string","label":"Subline (italic terracotta payoff)","default":"Le tien."},
  {"id":"brand","type":"string","label":"Brand mark","default":"Knowly · @knowly"}
]'>
<head><meta charset="utf-8"><title>slide-hook</title></head>
<body>
<template id="slide-hook-template">
  <div data-composition-id="slide-hook" data-width="1080" data-height="1920">
    <div class="hf-slide-hook">
      <div class="halo" data-layout-allow-overflow></div>
      <div class="eyebrow"></div>
      <h1 class="hook"></h1>
      <div class="subline"></div>
      <div class="brand"></div>
    </div>
    <style>
      [data-composition-id="slide-hook"] {
        position: relative;
        width: 1080px;
        height: 1920px;
        display: block;
      }
      [data-composition-id="slide-hook"] .hf-slide-hook {
        position: relative;
        width: 100%;
        height: 100%;
        background: #F5EFE8;
        font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
        color: #2B211D;
        overflow: hidden;
        box-sizing: border-box;
      }
      [data-composition-id="slide-hook"] .halo {
        position: absolute;
        top: 46%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 1500px;
        height: 1500px;
        background: radial-gradient(circle, rgba(177,79,46,0.12) 0%, rgba(177,79,46,0) 60%);
        pointer-events: none;
        will-change: transform, opacity;
      }
      [data-composition-id="slide-hook"] .eyebrow {
        position: absolute;
        top: 320px;
        left: 100px;
        right: 100px;
        font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
        font-size: 60px;
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: -0.01em;
        color: #B14F2E;
      }
      [data-composition-id="slide-hook"] .hook {
        position: absolute;
        top: 740px;
        left: 100px;
        right: 100px;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 240px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
        margin: 0;
        max-width: 880px;
        color: #2B211D;
      }
      [data-composition-id="slide-hook"] .subline {
        position: absolute;
        top: 1180px;
        left: 100px;
        right: 100px;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 96px;
        font-weight: 500;
        font-style: italic;
        line-height: 1.05;
        letter-spacing: -0.018em;
        color: #B14F2E;
        margin: 0;
        max-width: 880px;
      }
      [data-composition-id="slide-hook"] .brand {
        position: absolute;
        bottom: 100px;
        left: 100px;
        right: 100px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        color: #7A665C;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="slide-hook"]');
        const compId = root.getAttribute('data-composition-id');
        let vars = {};
        try {
          if (typeof __hyperframes !== "undefined" && __hyperframes && __hyperframes.getVariables) {
            vars = __hyperframes.getVariables() || {};
          } else if (window.__hyperframes && window.__hyperframes.getVariables) {
            vars = window.__hyperframes.getVariables() || {};
          }
        } catch (e) {}

        root.querySelector('.eyebrow').textContent = vars.eyebrow || "Articles. Podcasts. Vidéos.";
        root.querySelector('.hook').textContent = vars.hook || "Un seul média.";
        root.querySelector('.subline').textContent = vars.subline || "Le tien.";
        root.querySelector('.brand').textContent = vars.brand || "Knowly · @knowly";

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.from(`[data-composition-id="${compId}"] .halo`, { opacity: 0, scale: 0.85, duration: 0.8, ease: 'power2.out' }, 0);
        tl.from(`[data-composition-id="${compId}"] .eyebrow`, { y: 30, opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.1);
        tl.from(`[data-composition-id="${compId}"] .hook`, { y: 60, opacity: 0, duration: 0.7, ease: 'power3.out' }, 0.2);
        tl.from(`[data-composition-id="${compId}"] .subline`, { y: 40, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0.45);
        tl.from(`[data-composition-id="${compId}"] .brand`, { opacity: 0, duration: 0.4, ease: 'power1.out' }, 0.7);
        tl.to({}, { duration: 1.4 }, 1.1); // no-op tween: build.mjs stretches this to the slide duration
        window.__timelines[compId] = tl;
      })();
    </script>
  </div>
</template>
</body>
</html>
