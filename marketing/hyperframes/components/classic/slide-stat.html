<!doctype html>
<html lang="fr" data-composition-variables='[
  {"id":"captionTop","type":"string","label":"Caption top","default":"Ton audience te suit d&#233;j&#224;."},
  {"id":"number","type":"string","label":"Number","default":"100%"},
  {"id":"unit","type":"string","label":"Unit","default":"&#224; toi"},
  {"id":"captionBottom","type":"string","label":"Caption bottom","default":"Pas d&#39;algorithme entre vous."},
  {"id":"subline","type":"string","label":"Subline (italic terracotta payoff)","default":"Tes membres, ta relation directe."}
]'>
<head><meta charset="utf-8"><title>slide-stat</title></head>
<body>
<template id="slide-stat-template">
  <div data-composition-id="slide-stat" data-width="1080" data-height="1920">
    <div class="hf-slide-stat">
      <div class="halo" data-layout-allow-overflow></div>
      <div class="caption-top"></div>
      <div class="number-wrap">
        <span class="number"></span>
        <span class="unit"></span>
      </div>
      <div class="caption-bottom"></div>
      <div class="subline"></div>
    </div>
    <style>
      [data-composition-id="slide-stat"] {
        position: relative;
        width: 1080px;
        height: 1920px;
        display: block;
      }
      [data-composition-id="slide-stat"] .hf-slide-stat {
        position: relative;
        width: 100%;
        height: 100%;
        background: #F5EFE8;
        font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
        color: #2B211D;
        overflow: hidden;
        box-sizing: border-box;
        font-feature-settings: 'tnum' 1;
        font-variant-numeric: tabular-nums;
      }
      [data-composition-id="slide-stat"] .halo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 1300px;
        height: 1300px;
        background: radial-gradient(circle, rgba(177,79,46,0.11) 0%, rgba(177,79,46,0) 65%);
        pointer-events: none;
      }
      [data-composition-id="slide-stat"] .caption-top {
        position: absolute;
        top: 320px;
        left: 100px;
        right: 100px;
        font-size: 60px;
        font-weight: 600;
        line-height: 1.08;
        color: #43332B;
        letter-spacing: -0.01em;
      }
      [data-composition-id="slide-stat"] .number-wrap {
        position: absolute;
        top: 700px;
        left: 0;
        right: 0;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 20px;
        padding: 0 40px;
      }
      [data-composition-id="slide-stat"] .number {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 300px;
        font-weight: 600;
        line-height: 0.9;
        letter-spacing: -0.03em;
        color: #2B211D;
        white-space: nowrap;
      }
      [data-composition-id="slide-stat"] .unit {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 84px;
        font-weight: 500;
        font-style: italic;
        color: #B14F2E;
        letter-spacing: -0.01em;
      }
      [data-composition-id="slide-stat"] .caption-bottom {
        position: absolute;
        bottom: 470px;
        left: 100px;
        right: 100px;
        font-size: 64px;
        font-weight: 600;
        line-height: 1.15;
        color: #2B211D;
        letter-spacing: -0.015em;
        max-width: 880px;
      }
      [data-composition-id="slide-stat"] .subline {
        position: absolute;
        bottom: 280px;
        left: 100px;
        right: 100px;
        font-family: 'Newsreader', Georgia, serif;
        font-style: italic;
        font-size: 58px;
        font-weight: 500;
        line-height: 1.2;
        color: #B14F2E;
        letter-spacing: -0.018em;
        max-width: 880px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="slide-stat"]');
        const compId = root.getAttribute('data-composition-id');
        let vars = {};
        try {
          if (typeof __hyperframes !== "undefined" && __hyperframes && __hyperframes.getVariables) {
            vars = __hyperframes.getVariables() || {};
          } else if (window.__hyperframes && window.__hyperframes.getVariables) {
            vars = window.__hyperframes.getVariables() || {};
          }
        } catch (e) {}

        root.querySelector('.caption-top').textContent = vars.captionTop || "Ton audience te suit déjà.";
        root.querySelector('.number').textContent = vars.number || "100%";
        root.querySelector('.unit').textContent = vars.unit || "à toi";
        root.querySelector('.caption-bottom').textContent = vars.captionBottom || "Pas d'algorithme entre vous.";
        root.querySelector('.subline').textContent = vars.subline || "Tes membres, ta relation directe.";

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.from(`[data-composition-id="${compId}"] .halo`, { opacity: 0, scale: 0.9, duration: 0.7, ease: 'power2.out' }, 0);
        tl.from(`[data-composition-id="${compId}"] .caption-top`, { y: -20, opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.1);
        tl.from(`[data-composition-id="${compId}"] .number`, { y: 80, opacity: 0, scale: 0.92, duration: 0.7, ease: 'expo.out' }, 0.2);
        tl.from(`[data-composition-id="${compId}"] .unit`, { x: -20, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.4);
        tl.from(`[data-composition-id="${compId}"] .caption-bottom`, { y: 30, opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.5);
        tl.from(`[data-composition-id="${compId}"] .subline`, { y: 30, opacity: 0, duration: 0.55, ease: 'expo.out' }, 0.7);
        tl.to({}, { duration: 1.3 }, 1.2); // no-op tween: build.mjs stretches this to the slide duration
        window.__timelines[compId] = tl;
      })();
    </script>
  </div>
</template>
</body>
</html>
